name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest docstring_parser aiohttp
      - name: Run tests
        run: |
          python3 - <<'PY'
import os
from pathlib import Path
ws = Path("/root/workspace")
print("user:", os.getuid(), "home:", os.path.expanduser("~"))
print("ws exists:", ws.exists(), "is_dir:", ws.is_dir())
if ws.is_dir():
    raise SystemExit(0)
raise SystemExit(9)
PY
