name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest docstring_parser aiohttp
      - name: Run tests
        run: |
          N=$(python -m pytest tests/test_fixes_v131.py -k "browse_open or browse_get_text or browse_current_page or browse_new_tab or browse_click_link" --collect-only -q | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "COLLECTED=$N"
          if [ "$N" = "9" ]; then exit 0; else exit 9; fi
          exit 0
