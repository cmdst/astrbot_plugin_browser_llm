name: astrbot_plugin_browser_llm
display_name: LLM浏览器
desc: Agent 驱动的网页浏览插件。v1.7.0 起为「内嵌多模态子代理」架构：主 LLM 只用 browse_web 委派，网页交互/爬取/搜索由插件内置的内层模型承接（可从 AstrBot 已配置的多模态 provider 里选；纯文本内层模型走识图 caption 兜底），截图以 ImageContent 原生直达内层模型；搜索有两模式——external=外层工具 browser_web_search（默认，同 v1.6.0），internal=内层工具 browse_web_search 且外层强制停用；内层人格三档（default/current/custom）；配置结构 v5（7 组 / 配置叶 54 条 = JSON 叶子键 55 个）并带四模式迁移器。browse_local_page 仍是直调入口（路径校验必须同步拒绝，按规格 §1.4 不进子代理）。v1.6.1 修掉识图缓存串号与交互原语缺陷（事故 20261026）。后台两键（tools.background_mode / background_engine）语义不变。
short_desc: Agent 自主浏览网页（内嵌多模态子代理）
version: v1.7.0
author: AstrBot Community
repo: "https://github.com/cmdst/astrbot_plugin_browser_llm"
astrbot_version: ">=4.29.0"
support_platforms:
  - aiocqhttp
  - weixin_oc
