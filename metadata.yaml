name: astrbot_plugin_browser_llm
display_name: LLM浏览器
desc: Agent 驱动的网页浏览插件。LLM 通过 function-calling 自主浏览网页：导航、搜索、点击链接、提取正文与截图，无需用户手动指令，返回结构化浏览结果；v1.4.0 起另带可开关的多 API 并行搜索工具 browser_web_search；v1.5.0 起三个 LLM 工具可选后台异步执行（默认 off，结果单独发一条消息）；v1.6.0 起后台执行分两种引擎 tools.background_engine（默认 plugin=插件自管后台；core=平台原生后台任务，只对 browse_web 生效，须先上线核心修复并重启、再由运营方批准；核心未修时自动拒绝并降级回 plugin）。
short_desc: Agent 自主浏览网页
version: v1.6.0
author: AstrBot Community
repo: "https://github.com/cmdst/astrbot_plugin_browser_llm"
astrbot_version: ">=4.29.0"
support_platforms:
  - aiocqhttp
  - weixin_oc
