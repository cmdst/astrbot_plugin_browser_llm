name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest docstring_parser aiohttp
      - name: Run tests
        run: |
          which python python3
          python --version
          python3 --version
          python -m pip show pytest | head -3
          python3 -m pip show pytest | head -3
          python -m pytest --version
          exit 0
