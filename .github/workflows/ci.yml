name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest docstring_parser aiohttp
      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short -ra > /tmp/pt.txt 2>&1; RC=$?
          echo "## Pytest Output" >> $GITHUB_STEP_SUMMARY
          tail -120 /tmp/pt.txt >> $GITHUB_STEP_SUMMARY
          exit $RC
