name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest docstring_parser aiohttp
      - name: Run tests
        run: |
          python -m pytest tests/test_fixes_v131.py::test_resolve_local_page_roots_includes_platform_workspace -q --tb=long
          exit $?
