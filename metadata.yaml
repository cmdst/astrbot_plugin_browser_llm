name: astrbot_plugin_browser_llm
display_name: LLM浏览器
desc: Agent 驱动的网页浏览插件。v1.7.5 起底层架构整体换栈：感知走 CDP A11y 全树（role/name 结构化视图）+ Set-of-Mark 截图兜底，动作走 16 个结构化动作 + Playwright locator 定位 + CDP 受信任事件，每步操作后做确定性验证（期望/差分/无变化/重复守卫）；内层工具 26 → 5（browse_observe / browse_act / browse_screenshot / browse_media / browse_search）。v1.8.0 起：外层工具 3 → 5（新增只读的 browse_task_status / browse_recent_results —— 后台结果不进主模型上下文，模型只能自己回看，状态查询不含正文也不给完成时间）；后台换成轻量 7 态任务簿（queued/running/delivering/succeeded/failed/timeout/cancelled，每任务恰好一条终态）+ 极简同权投递层（走 Context.send_message 正规通道并重放 on_decorating_result / on_after_message_sent，不重试不补发）；修掉 browse_act 收到 JSON 字符串载荷时 8/8 全拒的 P0（边缘只解一层，动作闸门仍严格）。配置结构 v6 不变（7 组 / 配置叶 57 条 = JSON 叶子键 59 个，v1.8.0 零新增叶、无需迁移），并带五模式迁移器（v3/v4/v5 → v6 单跳）；整链墙钟预算 + task_key 去重；截图仅兜底且必须带 Set-of-Mark 编号，像素坐标不再是模型接口。
short_desc: Agent 自主浏览网页（内嵌多模态子代理 + 只读任务回看）
version: v1.8.0
author: AstrBot Community
repo: "https://github.com/cmdst/astrbot_plugin_browser_llm"
astrbot_version: ">=4.29.0"
support_platforms:
  - aiocqhttp
  - weixin_oc
